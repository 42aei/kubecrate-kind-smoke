apiVersion: apps/v1
kind: Deployment
metadata:
  name: cratecheck
  namespace: cratecheck
  labels:
    app.kubernetes.io/name: cratecheck
    app.kubernetes.io/part-of: kubecrate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cratecheck
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cratecheck
        app.kubernetes.io/part-of: kubecrate
    spec:
      serviceAccountName: cratecheck
      containers:
        - name: cratecheck
          image: ghcr.io/42aei/cratecheck:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cratecheck
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cratecheck-status-config
