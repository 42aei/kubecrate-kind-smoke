name: Kubernetes manifest linting

on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/kubernetes-manifest-linting.yaml'
  push:
    branches: [main]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/kubernetes-manifest-linting.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml
      - run: make validate
