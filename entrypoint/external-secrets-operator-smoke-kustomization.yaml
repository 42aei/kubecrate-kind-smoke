apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-operator-smoke
  namespace: flux-system
  labels:
    app.kubernetes.io/name: external-secrets-operator-smoke
    app.kubernetes.io/part-of: kubecrate-kind-smoke
    kubecrate.io/workload-category: platform-services
spec:
  dependsOn:
    - name: external-secrets-operator
  interval: 1m0s
  path: ./platform-services/external-secrets-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: kind-smoke
  timeout: 5m0s
  wait: true
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: SecretStore
      name: eso-smoke-kubernetes-store
      namespace: kubecrate-system
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: eso-smoke-projection
      namespace: kubecrate-system
