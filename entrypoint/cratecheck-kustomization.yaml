apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cratecheck
  namespace: flux-system
  labels:
    app.kubernetes.io/name: cratecheck
    app.kubernetes.io/part-of: kubecrate-kind-smoke
    kubecrate.io/workload-category: application-services
spec:
  dependsOn:
    - name: external-secrets-operator-smoke
  interval: 1m0s
  path: ./application-services/cratecheck
  prune: true
  sourceRef:
    kind: GitRepository
    name: kind-smoke
  timeout: 5m0s
  wait: true
