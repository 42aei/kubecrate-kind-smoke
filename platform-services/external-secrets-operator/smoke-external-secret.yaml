apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: eso-smoke-kubernetes-store
  namespace: kubecrate-system
  labels:
    app.kubernetes.io/name: eso-smoke-kubernetes-store
    app.kubernetes.io/part-of: kubecrate
    kubecrate.io/workload-category: platform-services
    kubecrate.io/smoke-test: external-secrets-operator
spec:
  provider:
    kubernetes:
      remoteNamespace: kubecrate-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-smoke-store-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-smoke-projection
  namespace: kubecrate-system
  labels:
    app.kubernetes.io/name: eso-smoke-projection
    app.kubernetes.io/part-of: kubecrate
    kubecrate.io/workload-category: platform-services
    kubecrate.io/smoke-test: external-secrets-operator
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: eso-smoke-kubernetes-store
  target:
    name: eso-smoke-projected
    creationPolicy: Owner
  data:
    - secretKey: smoke-test
      remoteRef:
        key: eso-smoke-source
        property: smoke-test
