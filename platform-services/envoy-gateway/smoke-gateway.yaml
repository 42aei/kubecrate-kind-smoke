apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kubecrate-envoy-smoke
  namespace: core-envoy-gateway
  labels:
    app.kubernetes.io/name: envoy-gateway
    app.kubernetes.io/part-of: kubecrate
    kubecrate.io/workload-category: platform-services
    kubecrate.io/smoke-test: envoy-gateway
spec:
  gatewayClassName: kubecrate-envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: cratecheck-tls
            namespace: cratecheck
      allowedRoutes:
        namespaces:
          from: All
